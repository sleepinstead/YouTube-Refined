<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Refined</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="head">
        <img class="logo" src="../../public/icon.png" alt="" />
        <h1 class="name">YouTube Refined</h1>
        <span id="status" class="status" role="status" aria-live="polite" data-state="idle"></span>
      </header>

      <nav class="tabs" role="tablist" aria-label="Settings sections">
        <button class="tab" role="tab" id="tab-feed" aria-controls="panel-feed" aria-selected="true" tabindex="0" type="button">Feed</button>
        <button class="tab" role="tab" id="tab-watch" aria-controls="panel-watch" aria-selected="false" tabindex="-1" type="button">Watch</button>
        <button class="tab" role="tab" id="tab-navbar" aria-controls="panel-navbar" aria-selected="false" tabindex="-1" type="button">Navbar</button>
        <button class="tab" role="tab" id="tab-layout" aria-controls="panel-layout" aria-selected="false" tabindex="-1" type="button">Layout</button>
      </nav>

      <div class="panels">
      <div class="panel" role="tabpanel" id="panel-feed" aria-labelledby="tab-feed">
          <label class="row" for="blockShorts">
            <span class="row-text"><span class="row-title">Block Shorts</span><span class="row-desc" id="shortsNote">Removes Shorts from feeds; Shorts links go home.</span></span>
            <span class="switch"><input id="blockShorts" type="checkbox" role="switch" aria-describedby="shortsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideExploreTopics">
            <span class="row-text"><span class="row-title">Hide topic sections</span><span class="row-desc" id="topicsNote">Removes “Explore more topics” from feeds.</span></span>
            <span class="switch"><input id="hideExploreTopics" type="checkbox" role="switch" aria-describedby="topicsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideMemberships">
            <span class="row-text"><span class="row-title">Hide membership sections</span><span class="row-desc" id="membershipsNote">Removes “Get more from memberships” from feeds.</span></span>
            <span class="switch"><input id="hideMemberships" type="checkbox" role="switch" aria-describedby="membershipsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideMixes">
            <span class="row-text"><span class="row-title">Hide Mixes</span><span class="row-desc" id="mixesNote">Removes Mix playlists from feeds.</span></span>
            <span class="switch"><input id="hideMixes" type="checkbox" role="switch" aria-describedby="mixesNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideFilterChips">
            <span class="row-text"><span class="row-title">Hide filter chips</span><span class="row-desc" id="filterChipsNote">Removes the topic filter bar (All, Gaming, Music…) from feeds.</span></span>
            <span class="switch"><input id="hideFilterChips" type="checkbox" role="switch" aria-describedby="filterChipsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideHoverPreviews">
            <span class="row-text"><span class="row-title">Hide hover previews</span><span class="row-desc" id="hideHoverPreviewsNote">Stops videos from auto-playing when you hover over a thumbnail.</span></span>
            <span class="switch"><input id="hideHoverPreviews" type="checkbox" role="switch" aria-describedby="hideHoverPreviewsNote" /><span class="track"></span></span>
          </label>
          <h2 class="group-label">Filter videos</h2>
          <label class="row" for="hideLiveStreams">
            <span class="row-text"><span class="row-title">Hide live streams</span><span class="row-desc" id="liveStreamsNote">Removes live videos from feeds.</span></span>
            <span class="switch"><input id="hideLiveStreams" type="checkbox" role="switch" aria-describedby="liveStreamsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideStartedVideos">
            <span class="row-text"><span class="row-title">Hide started videos</span><span class="row-desc" id="startedVideosNote">Removes videos with playback progress.</span></span>
            <span class="switch"><input id="hideStartedVideos" type="checkbox" role="switch" aria-describedby="startedVideosNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hidePlaylists">
            <span class="row-text"><span class="row-title">Hide playlists</span><span class="row-desc" id="playlistsNote">Removes playlist cards from feeds.</span></span>
            <span class="switch"><input id="hidePlaylists" type="checkbox" role="switch" aria-describedby="playlistsNote" /><span class="track"></span></span>
          </label>
      </div>
      <div class="panel" role="tabpanel" id="panel-watch" aria-labelledby="tab-watch" hidden>
          <label class="row" for="videoQuality">
            <span class="row-text"><span class="row-title">Default resolution</span><span class="row-desc" id="qualityNote">Applied when a video starts; falls back to the next best if unavailable.</span></span>
            <select id="videoQuality" class="select" aria-describedby="qualityNote">
              <option value="auto">Auto</option>
              <option value="highres">Highest</option>
              <option value="hd2160">2160p</option>
              <option value="hd1440">1440p</option>
              <option value="hd1080">1080p</option>
              <option value="hd720">720p</option>
              <option value="large">480p</option>
              <option value="medium">360p</option>
              <option value="small">240p</option>
              <option value="tiny">144p</option>
            </select>
          </label>
          <label class="row" for="playbackSpeed">
            <span class="row-text"><span class="row-title">Default speed</span><span class="row-desc" id="speedNote">Playback speed for new videos.</span></span>
            <select id="playbackSpeed" class="select" aria-describedby="speedNote">
              <option value="default">Default</option>
              <option value="0.75">0.75×</option>
              <option value="1">1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="1.75">1.75×</option>
              <option value="2">2×</option>
            </select>
          </label>
          <label class="row" for="hideComments">
            <span class="row-text"><span class="row-title">Hide comments</span><span class="row-desc" id="commentsNote">Hides the comments area on watch pages.</span></span>
            <span class="switch"><input id="hideComments" type="checkbox" role="switch" aria-describedby="commentsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideRecommendations">
            <span class="row-text"><span class="row-title">Hide watch-page sidebar</span><span class="row-desc" id="recommendationsNote">Hides recommendations or live chat beside the player.</span></span>
            <span class="switch"><input id="hideRecommendations" type="checkbox" role="switch" aria-describedby="recommendationsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideEndScreen">
            <span class="row-text"><span class="row-title">Hide end-screen cards</span><span class="row-desc" id="endScreenNote">Hides video suggestions at playback end.</span></span>
            <span class="switch"><input id="hideEndScreen" type="checkbox" role="switch" aria-describedby="endScreenNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideAmbientMode">
            <span class="row-text"><span class="row-title">Hide ambient glow</span><span class="row-desc" id="hideAmbientModeNote">Removes the coloured glow behind the player.</span></span>
            <span class="switch"><input id="hideAmbientMode" type="checkbox" role="switch" aria-describedby="hideAmbientModeNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideInfoCards">
            <span class="row-text"><span class="row-title">Hide in-video overlays</span><span class="row-desc" id="hideInfoCardsNote">Hides info cards, paid promotion labels and channel watermarks on the player.</span></span>
            <span class="switch"><input id="hideInfoCards" type="checkbox" role="switch" aria-describedby="hideInfoCardsNote" /><span class="track"></span></span>
          </label>
      </div>
      <div class="panel" role="tabpanel" id="panel-navbar" aria-labelledby="tab-navbar" hidden>
          <label class="row" for="showNavbarSettings">
            <span class="row-text"><span class="row-title">Settings button in navbar</span><span class="row-desc" id="navbarSettingsNote">Adds a gear icon to the top navbar (right of your profile) to quickly open YouTube settings.</span></span>
            <span class="switch"><input id="showNavbarSettings" type="checkbox" role="switch" aria-describedby="navbarSettingsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideCreateButton">
            <span class="row-text"><span class="row-title">Hide Create button</span><span class="row-desc" id="createButtonNote">Removes the “+ Create” button from the top navbar.</span></span>
            <span class="switch"><input id="hideCreateButton" type="checkbox" role="switch" aria-describedby="createButtonNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideVoiceSearch">
            <span class="row-text"><span class="row-title">Hide voice search</span><span class="row-desc" id="voiceSearchNote">Removes the microphone button next to the search bar.</span></span>
            <span class="switch"><input id="hideVoiceSearch" type="checkbox" role="switch" aria-describedby="voiceSearchNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideNotifications">
            <span class="row-text"><span class="row-title">Hide notifications</span><span class="row-desc" id="notificationsNote">Removes the notification bell icon from the top navbar.</span></span>
            <span class="switch"><input id="hideNotifications" type="checkbox" role="switch" aria-describedby="notificationsNote" /><span class="track"></span></span>
          </label>
          <label class="row" for="hideCountryCode">
            <span class="row-text"><span class="row-title">Hide country code</span><span class="row-desc" id="countryCodeNote">Removes the country code badge next to the YouTube logo.</span></span>
            <span class="switch"><input id="hideCountryCode" type="checkbox" role="switch" aria-describedby="countryCodeNote" /><span class="track"></span></span>
          </label>
      </div>
      <div class="panel" role="tabpanel" id="panel-layout" aria-labelledby="tab-layout" hidden>
          <section class="card" aria-labelledby="columnsTitle">
            <div class="card-head">
              <label id="columnsTitle" class="row-title" for="gridColumnsEnabled">Video grid columns</label>
              <span class="switch"><input id="gridColumnsEnabled" type="checkbox" role="switch" checked /><span class="track"></span></span>
            </div>
            <div id="gridBody" class="grid-body">
              <div class="stepper-row">
                <span class="row-desc">Columns per row</span>
                <div class="stepper">
                  <button id="decrement" class="icon-btn" type="button" aria-label="Fewer columns" data-tip="Fewer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z"/></svg></button>
                  <input id="count" class="stepper-input" type="number" inputmode="numeric" min="1" max="10" value="4" aria-label="Number of columns" />
                  <button id="increment" class="icon-btn" type="button" aria-label="More columns" data-tip="More"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
                </div>
              </div>
              <input id="slider" class="slider" type="range" min="1" max="10" step="1" value="4" aria-label="Number of columns" />
              <div class="grid-foot">
                <span class="scale" aria-hidden="true"><span>1</span><span>10</span></span>
              </div>
              <button id="reset" class="btn" type="button">Reset to default</button>
            </div>
          </section>
          <p id="note" class="note" role="status" aria-live="polite" hidden></p>
          <label class="row" for="hideSidebar">
            <span class="row-text"><span class="row-title">Hide mini-sidebar</span><span class="row-desc" id="sidebarNote">Removes the collapsed sidebar (Home, Shorts, Subscriptions…); the menu button still opens the full sidebar.</span></span>
            <span class="switch"><input id="hideSidebar" type="checkbox" role="switch" aria-describedby="sidebarNote" /><span class="track"></span></span>
          </label>
      </div>
      </div>
    </main>

    <!-- Settings shared with content script -->
    <script src="../core/settings.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
